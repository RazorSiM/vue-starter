name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json's `packageManager` field,
      # so it stays defined in exactly one place.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      # Mandatory, never optional: with eslint-plugin-vue gone, vue-tsc is the
      # only remaining Vue-aware static analysis in this repo.
      - name: Type check
        run: pnpm run type-check

      - name: Unit tests
        run: pnpm run test

      # build-only, since type-check already ran as its own step above.
      - name: Build
        run: pnpm run build-only

      # vue-router's plugin defaults `watch` to !CI, so it does one scan and writes.
      # This fails loudly if someone forgot to commit a route rename.
      - name: Generated files are up to date
        run: git diff --exit-code -- auto-imports.d.ts components.d.ts src/typed-router.d.ts

      # No PLAYWRIGHT_BROWSERS_PATH here (that is the NixOS dev-shell path),
      # so Playwright downloads its own browsers normally.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      # CI=1 is set by Actions, so this tests `vite preview` on :4173 —
      # which is why the build step must come first.
      - name: E2E tests
        run: pnpm run test:e2e

  # Static assets on a Cloudflare Worker. Gated behind `needs: ci`, so main only ever
  # deploys a commit that passed lint, types, units and e2e.
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Gives the repo a native Deployments panel linking to the live site.
    # wrangler-action does not create GitHub deployment records on its own.
    # Caveat: a run where the deploy steps are skipped (a fork with no token)
    # still records a deployment, since the environment is a job-level property.
    environment:
      name: production
      url: https://vue-starter.raz.wtf

    # Required by wrangler-action to mint the OIDC token it uses for provenance.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A fork of this template has no Cloudflare secrets and should not get a red
      # main because of it. `secrets` is unavailable in a job-level `if`, so the
      # check has to happen in a step.
      - name: Are Cloudflare credentials configured?
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::CLOUDFLARE_API_TOKEN is not set — skipping the deploy.'
          fi

      # Rebuilt rather than carried over from the ci job as an artifact: the build is
      # under a second, and an artifact round-trip is neither faster nor more honest.
      - name: Build
        if: steps.credentials.outputs.ready == 'true'
        run: pnpm run build-only

      - name: Deploy to Cloudflare Workers
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
