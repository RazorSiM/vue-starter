# pnpm 11 reads these here, not from the "pnpm" field in package.json.

# lefthook's install script links its Go binary. pnpm blocks dependency build
# scripts by default, and without this the `prepare: lefthook install` script
# fails — silently leaving every contributor without git hooks.
allowBuilds:
  # wrangler's own toolchain: esbuild fetches its native binary, workerd is the
  # Workers runtime `wrangler dev` runs locally. Blocked, `wrangler` errors on use.
  esbuild: true

  lefthook: true

  # Rewrites public/mockServiceWorker.js whenever msw is upgraded, keyed off the
  # "msw".workerDirectory field `msw init --save` wrote into package.json. Without
  # it the committed worker silently drifts out of sync with the installed msw.
  msw: true

  # @tanstack/vue-query depends on vue-demi, whose postinstall points the package
  # at the Vue 3 build. Skipping it leaves the Vue 2 entry in place.
  vue-demi: true

  workerd: true

# pnpm 11 withholds packages published very recently (minimumReleaseAge).
# Icon collections publish constantly, so this one is exempted.
minimumReleaseAgeExclude:
  - '@iconify-json/lucide@1.2.120'

# oxlint-plugin-vize is pre-1.0 with a very high release cadence, so it is
# pinned exactly and held there transitively.
overrides:
  oxlint-plugin-vize: 0.291.0
